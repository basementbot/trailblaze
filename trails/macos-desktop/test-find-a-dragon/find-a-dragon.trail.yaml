- config:
    title: 'Find a dragon to print: Bambu Studio, then keep looking in Chrome'
    platform: desktop
    driver: macos-ax
# Runs on the whole-desktop device (`--device desktop/all`), which is what lets one session span
# two applications. A single-app device would need a second session to reach the browser.
#
# PRECONDITION: Bambu Studio's cold-start prompts ("Configuration update", "New version of Bambu
# Studio") must already be dismissed. They are deliberately NOT part of this trail. They appear
# only on some launches, on a network-dependent delay, and they expose no buttons to Accessibility
# at all — so scripting them means blind coordinate clicks gated on a dialog that may never come.
# Asserting them made the trail fail in both directions: clicking before they rendered, then
# waiting for one that never arrived. Environmental noise belongs in setup, not in the test.
# `macos_tapPoint` exists for dismissing them by hand when they do show up.
- prompts:
  - step: Open Bambu Studio and land on the model library
    recording:
      tools:
      - macos_launchApp:
          bundleId: com.bambulab.bambu-studio
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXWindow
              titleRegex: "Untitled"
          timeoutMs: 60000

  - step: Search the online model catalog for a dragon
    recording:
      tools:
      # Coordinate click: Bambu's search box is an AXTextField with no title, id, or value to
      # select on until something has been typed into it, and there are several such fields in the
      # tree. Nothing here identifies it but its position.
      - macos_tapPoint:
          x: 925
          y: 147
      - macos_inputText:
          text: "dragon"
      - macos_pressKey:
          key: ENTER
      # 90s, and that is not padding. Every selector poll re-walks the AX tree of every on-screen
      # app, which on this desktop (with Bambu's embedded web view) costs ~27 seconds per capture.
      # A 20s timeout therefore permits exactly ONE attempt, taken before the results have rendered
      # — the assertion failed while the dragons were plainly on screen. Timeouts on the
      # whole-desktop device have to be sized against the capture cost, not against how fast the
      # app feels to a human.
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXLink
              titleRegex: ".*[Dd]ragon.*"
          timeoutMs: 90000

  - step: Open the Flexi Dragon and confirm it is actually printable
    recording:
      tools:
      - macos_tapOnElement:
          nodeSelector:
            macOsAx:
              roleRegex: AXLink
              titleRegex: "Flexi Dragon"
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXHeading
              titleRegex: "Flexi Dragon"
          timeoutMs: 90000
      # A model is only worth anything if someone has published a print profile for it — that's the
      # difference between a picture of a dragon and a dragon you can put on the plate.
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXHeading
              titleRegex: ".*Print Profile.*"
          timeoutMs: 90000

  - step: Keep shopping in the browser, where there are more of them
    recording:
      tools:
      - macos_openUrl:
          url: https://makerworld.com/en/search/models?keyword=dragon
          browserBundleId: com.google.Chrome
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXTextField
              valueRegex: ".*makerworld.com.*dragon.*"
          timeoutMs: 90000
      # descriptionRegex, not titleRegex — the one real gotcha in this trail. Chrome publishes a
      # link's text as AXDescription; the WebKit view embedded in Bambu Studio publishes the same
      # thing as AXTitle. Identical role, identical words on screen, and the snapshot renders them
      # identically because it collapses title/value/description into a single display string. The
      # titleRegex that matches in Bambu silently matches nothing here.
      - macos_assertVisible:
          nodeSelector:
            macOsAx:
              roleRegex: AXLink
              descriptionRegex: ".*[Dd]ragon.*"
          timeoutMs: 90000
